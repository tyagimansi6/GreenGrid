services:
  - type: web
    name: greengrid-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    startCommand: python backend/manage.py migrate && python backend/manage.py createsuperuser_if_none_exists && python backend/manage.py seed_demo && gunicorn greengrid.wsgi:application --bind 0.0.0.0:$PORT --chdir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
